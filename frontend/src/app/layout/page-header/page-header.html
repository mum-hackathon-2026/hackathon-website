<div class="page-header">
  <div class="page-header__text">
    @if (eyebrow(); as label) {
      <p class="page-header__eyebrow">{{ label }}</p>
    }
    <h1 class="page-header__title">{{ title() }}</h1>
    @if (subtitle(); as sub) {
      <p class="page-header__subtitle">{{ sub }}</p>
    }
  </div>
  <!-- Anything projected here sits to the right of the title, e.g. page actions. -->
  <div class="page-header__actions">
    <ng-content />
  </div>
</div>
