<!-- The Averis design guideline's hexagon/circuit/wave motif — the page
     canvas texture, replacing what used to be a dot grid. Kept to the Averis
     palette (orange/peach for line art, the second palette's red/blue/green/
     yellow only on the small accent dots) rather than mixing in Google's,
     matching the guideline's own example pages. Corner- and edge-anchored,
     low-opacity, so it reads as texture behind the nav pill and page content
     rather than as artwork competing with either. Fixed to the viewport, so
     it renders once here and every route — admin and judge screens included —
     gets the same canvas. -->
<div class="backdrop-motif" aria-hidden="true" style="pointer-events: none">
  <!-- Honeycomb, top-right: three overlapping hexagons, one colour, fading
       stroke-opacity — the guideline's cluster, not a rainbow of them. -->
  <svg class="backdrop-motif__honeycomb" viewBox="0 0 200 170" fill="none">
    <polygon
      points="45,2 85,23 85,56 45,77 5,56 5,23"
      stroke="#e78823"
      stroke-width="1.6"
      stroke-opacity="0.9"
      transform="translate(60,0)"
    />
    <polygon
      points="45,2 85,23 85,56 45,77 5,56 5,23"
      stroke="#e78823"
      stroke-width="1.6"
      stroke-opacity="0.55"
      transform="translate(15,38)"
    />
    <polygon
      points="45,2 85,23 85,56 45,77 5,56 5,23"
      stroke="#e78823"
      stroke-width="1.4"
      stroke-opacity="0.35"
      transform="translate(85,70) scale(0.7)"
    />
  </svg>

  <!-- A single larger hexagon, low in the page, per the standalone outline in
       the guideline's example designs. -->
  <svg class="backdrop-motif__hex-solo" viewBox="0 0 100 87" fill="none">
    <polygon points="50,2 95,25 95,62 50,85 5,62 5,25" stroke="#ffc119" stroke-width="1.6" stroke-opacity="0.4" />
  </svg>

  <!-- Circuit trace, top-left: thin lines, hollow nodes, one colour family. -->
  <svg class="backdrop-motif__circuit" viewBox="0 0 260 130" fill="none">
    <path
      d="M0,26 H55 L74,44 H128 L142,30 H200"
      stroke="#e78823"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.55"
    />
    <circle cx="55" cy="26" r="3" stroke="#e78823" stroke-width="1.5" stroke-opacity="0.55" />
    <circle cx="128" cy="44" r="3" stroke="#e78823" stroke-width="1.5" stroke-opacity="0.55" />
    <circle cx="200" cy="30" r="3" fill="#e78823" opacity="0.55" />
    <path
      d="M8,82 H62 L80,96 H130"
      stroke="#efa765"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.5"
    />
    <circle cx="62" cy="82" r="2.5" fill="#efa765" opacity="0.5" />
  </svg>

  <!-- Wave, along the bottom: thin blue lines fanning out over layered orange
       contour bands, per the guideline's wave element. -->
  <svg class="backdrop-motif__wave-lines" viewBox="0 0 480 140" preserveAspectRatio="none" fill="none">
    <path d="M-40,40 C160,10 300,90 480,50" stroke="#2b82fb" stroke-width="1.4" stroke-opacity="0.45" />
    <path d="M-40,70 C160,40 300,120 480,80" stroke="#2b82fb" stroke-width="1.4" stroke-opacity="0.3" />
    <path d="M-40,100 C160,70 300,150 480,110" stroke="#2b82fb" stroke-width="1.4" stroke-opacity="0.18" />
  </svg>

  <svg class="backdrop-motif__wave-contour" viewBox="0 0 1440 220" preserveAspectRatio="none" fill="none">
    <path
      d="M0,150 C240,130 480,175 720,150 C960,125 1200,170 1440,150 V220 H0 Z"
      fill="#e78823"
      opacity="0.14"
    />
    <path
      d="M0,175 C240,160 480,195 720,175 C960,155 1200,190 1440,175 V220 H0 Z"
      fill="#e78823"
      opacity="0.2"
    />
    <path
      d="M0,198 C240,188 480,208 720,198 C960,185 1200,208 1440,198 V220 H0 Z"
      fill="#e78823"
      opacity="0.28"
    />
  </svg>

  <!-- Small accent dots in Averis's second palette, scattered singly across
       the margins the way the guideline's example pages do — never clustered,
       never on top of the line art above. -->
  <span class="backdrop-motif__dot backdrop-motif__dot--red"></span>
  <span class="backdrop-motif__dot backdrop-motif__dot--blue"></span>
  <span class="backdrop-motif__dot backdrop-motif__dot--green"></span>
  <span class="backdrop-motif__dot backdrop-motif__dot--yellow"></span>
</div>
