<!-- Decoration only, and never interactive: hidden from assistive tech and
     transparent to the pointer. The wells drift; the dot mask on the container
     does not, which is what makes the colour appear to move through the grid
     rather than the grid move around the page. -->
<div class="backdrop" aria-hidden="true">
  <span class="backdrop__well backdrop__well--blue"></span>
  <span class="backdrop__well backdrop__well--red"></span>
  <span class="backdrop__well backdrop__well--yellow"></span>
  <span class="backdrop__well backdrop__well--green"></span>
</div>
