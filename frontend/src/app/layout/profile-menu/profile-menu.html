<div class="profile-menu role--{{ user().role }}">
  <div class="profile-menu__identity">
    <span class="profile-menu__avatar" aria-hidden="true">{{ user().initials }}</span>
    <span class="profile-menu__who">
      <span class="profile-menu__name">{{ user().name }}</span>
      <span class="profile-menu__email">{{ user().email }}</span>
    </span>
  </div>

  <!-- The nav's role chip is hidden on narrow screens, so the role is repeated
       here to stay visible inside the mobile drawer. -->
  <p class="profile-menu__role">{{ roleLabels[user().role] }}</p>

  <div class="profile-menu__section">
    <button type="button" class="profile-menu__sign-out" (click)="signOut()">
      <svg
        class="profile-menu__sign-out-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      Sign out
    </button>
  </div>
</div>
