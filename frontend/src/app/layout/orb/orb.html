@if (visible()) {
  <!-- position: fixed, so this never enters page layout and cannot reflow copy. -->
  <!-- #anchor is written to directly by the animation loop; its transform is
       not bound, so the frame rate costs no change detection. -->
  <div
    #anchor
    class="orb"
    [class.orb--placed]="spot() !== null"
    [class.orb--flip]="panelOnRight()"
    (mouseenter)="onPointerEnter()"
    (mouseleave)="onPointerLeave()"
  >
    @if (open()) {
      <div class="orb__panel" role="dialog" aria-label="Hackathon shortcut">
        @if (signedIn()) {
          <p class="orb__greeting">Hi {{ firstName() }}</p>
          @if (status(); as line) {
            <p class="orb__status">{{ line }}</p>
          }
        } @else {
          <p class="orb__pitch">Not registered yet?</p>
          <a
            class="orb__action"
            [href]="registrationFormUrl"
            target="_blank"
            rel="noopener noreferrer"
          >
            Register your team
            <span class="orb__action-arrow" aria-hidden="true">&rarr;</span>
          </a>
        }
      </div>
    } @else if (nudgeMessage(); as line) {
      <!-- Decorative only: a passing attention-getter, not information —
           the button's own aria-label already says what opening it does. -->
      <div class="orb__nudge" aria-hidden="true">{{ line }}</div>
    }

    <button
      type="button"
      class="orb__button"
      [class.orb__button--open]="open()"
      [attr.aria-expanded]="open()"
      [attr.aria-label]="
        signedIn() ? 'Open your hackathon status' : 'Open team registration shortcut'
      "
      (click)="toggle()"
    >
      <!-- A four-pointed sparkle: four cubic curves that bow inward toward the
           centre, which is what makes the points read as points rather than as
           a diamond. Symmetric, so it survives the slow rotation without ever
           looking like it is at a wrong angle. -->
      <svg class="orb__spark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="orb-spark-fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--orb-lift)" />
            <stop offset="55%" stop-color="var(--orb-core)" />
            <stop offset="100%" stop-color="var(--orb-deep)" />
          </linearGradient>
        </defs>
        <path
          d="M12 0C12 6.63 6.63 12 0 12C6.63 12 12 17.37 12 24C12 17.37 17.37 12 24 12C17.37 12 12 6.63 12 0Z"
          fill="url(#orb-spark-fill)"
        />
      </svg>
    </button>
  </div>
}
