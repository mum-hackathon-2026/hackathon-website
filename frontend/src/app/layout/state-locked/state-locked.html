<div class="state-locked">
  <!-- Inert rather than hidden: seeing the disabled thing explains the message. -->
  <div class="state-locked__preview" aria-hidden="true">
    <ng-content />
  </div>

  <div class="state-locked__notice">
    <svg
      class="state-locked__icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="11" width="18" height="11" rx="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </svg>
    <div class="state-locked__text">
      <p class="state-locked__heading">{{ heading() }}</p>
      @if (reason(); as why) {
        <p class="state-locked__reason">{{ why }}</p>
      }
      @if (deadline(); as when) {
        <p class="state-locked__deadline">{{ when }}</p>
      }
    </div>
  </div>
</div>
