<section class="rubric-section" aria-labelledby="rubric-heading">
  <div class="rubric-header">
    <div>
      <p class="rubric-eyebrow">Averis Hackathon 2026</p>
      <h2 class="rubric-title" id="rubric-heading">Preliminary Round Judging Criteria</h2>
      <p class="rubric-subtitle">
        The full scoring rubric and criteria breakdown now live in a shared document.
      </p>
    </div>
  </div>

  <app-form-link-card
    heading="Judging Criteria Document"
    description="Review the complete scoring rubric, category weightings and performance bands before scoring a submission."
    [href]="rubricDocUrl"
    buttonLabel="Open Judging Criteria"
  />
</section>
