<section class="organizers" id="organizers">
  <div class="organizers__inner">
    <h2 class="section-heading section-heading--center organizers__heading">Organizers</h2>

    <!-- Infinite Auto-Scrolling Marquee for Partners -->
    <div class="organizers__marquee" aria-label="Organizing Partners Showcase">
      <div class="organizers__marquee-track">
        <!-- Main Marquee Group -->
        <ul class="organizers__partners organizers__marquee-group">
          @for (partner of marqueePartners; track $index) {
            <li class="organizers__partner">
              @if (partner.logo) {
                <img
                  [src]="partner.logo"
                  [alt]="partner.name + ' logo'"
                  class="organizers__partner-logo"
                  loading="lazy"
                />
              } @else {
                <p class="organizers__partner-wordmark">{{ partner.name }}</p>
              }
            </li>
          }
        </ul>

        <!-- Duplicated Group for Seamless -50% Loop (aria-hidden for screen readers) -->
        <ul class="organizers__partners organizers__marquee-group" aria-hidden="true">
          @for (partner of marqueePartners; track $index) {
            <li class="organizers__partner">
              @if (partner.logo) {
                <img
                  [src]="partner.logo"
                  [alt]="partner.name + ' logo'"
                  class="organizers__partner-logo"
                  loading="lazy"
                />
              } @else {
                <p class="organizers__partner-wordmark">{{ partner.name }}</p>
              }
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
