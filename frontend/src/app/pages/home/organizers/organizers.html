<section class="organizers">
  <div class="organizers__inner">
    <p class="section-eyebrow section-eyebrow--center">Organizers</p>
    <h2 class="section-heading section-heading--center">Who runs it.</h2>

    <ul class="organizers__partners">
      @for (partner of partners; track partner.name) {
        <li class="organizers__partner">
          @if (partner.logo) {
            <div class="organizers__partner-logo-box">
              <img
                [src]="partner.logo"
                [alt]="partner.name + ' logo'"
                class="organizers__partner-logo"
                loading="lazy"
              />
            </div>
          }
          <div class="organizers__partner-meta">
            <p class="organizers__partner-role">{{ partner.role }}</p>
            <p class="organizers__partner-name">{{ partner.name }}</p>
          </div>
        </li>
      }
    </ul>

    <ul class="organizers__grid">
      @for (person of organizers; track person.name) {
        <li class="organizers__card">
          <span
            class="organizers__avatar organizers__avatar--{{ person.accent }}"
            aria-hidden="true"
          >
            {{ person.initials }}
          </span>
          <span class="organizers__details">
            <span class="organizers__name">{{ person.name }}</span>
            <span class="organizers__role">{{ person.role }}</span>
          </span>
        </li>
      }
    </ul>
  </div>
</section>
