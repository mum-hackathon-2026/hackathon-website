<section class="sponsors" id="sponsors">
  <div class="sponsors__inner">
    <p class="section-eyebrow section-eyebrow--center">Our sponsor</p>
    <h2 class="section-heading section-heading--center">Powered by Averis.</h2>

    @for (sponsor of sponsors; track sponsor.name) {
      <div class="sponsors__mark">
        @if (hasLogo(sponsor)) {
          <!--
            Deliberately not loading="lazy". The logo is sized entirely in CSS,
            so before it loads its box is 0x0 — and a zero-area image never
            registers as intersecting, so lazy loading would wait forever for a
            visibility that only loading could produce. Eager is also the right
            call on the merits: one 25 kB same-origin asset, and .sponsors__mark
            already reserves its space.
          -->
          <img
            class="sponsors__logo"
            [src]="sponsor.logo"
            [alt]="sponsor.name"
            (error)="onLogoError(sponsor)"
          />
        } @else {
          <!-- The name is repeated below so the accessible label survives the swap. -->
          <span class="sponsors__wordmark" aria-hidden="true">{{ sponsor.name }}</span>
          <span class="visually-hidden">{{ sponsor.name }}</span>
        }
      </div>
    }

    <p class="sponsors__note">Averis makes this hackathon possible.</p>
  </div>
</section>
