<section class="sign-in">
  <p class="section-eyebrow section-eyebrow--center">Sign in</p>
  <h1 class="section-heading section-heading--center">Pick a demo account.</h1>
  <p class="sign-in__blurb">
    Real sign-in arrives with Google authentication. Until then, choose an account to explore what
    each role sees.
  </p>

  <ul class="sign-in__accounts">
    @for (role of roles; track role) {
      <li>
        <button type="button" class="sign-in__account role--{{ role }}" (click)="signIn(role)">
          <span class="sign-in__avatar" aria-hidden="true">{{ accounts[role].initials }}</span>
          <span class="sign-in__details">
            <span class="sign-in__name">{{ accounts[role].name }}</span>
            <span class="sign-in__email">{{ accounts[role].email }}</span>
          </span>
          <span class="sign-in__role-tag role--{{ role }}">{{ roleLabels[role] }}</span>
        </button>
      </li>
    }
  </ul>

  <p class="sign-in__footnote">
    <a class="sign-in__back" routerLink="/">Back to the homepage</a>
  </p>
</section>
