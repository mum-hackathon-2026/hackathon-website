spring.application.name=hackathon-website-backend
server.port=${PORT:8080}

# Schema is owned by Flyway. Hibernate only verifies that the entity mappings match
# what the migrations produced; it must never issue DDL of its own.
spring.jpa.hibernate.ddl-auto=validate

# Keep the database connection scoped to the transaction rather than the whole HTTP
# request, so lazy associations cannot trigger queries during response rendering.
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Credentials are deliberately absent here. Flyway runs as hackathon_migrator and the
# application runs as hackathon_app; both sets of credentials come from the active
# profile (application-local.properties locally, environment variables in CI).

# Google OAuth2 and JWT settings are supplied by the active profile.
# See application-example.properties for the full list.

app.sheets.sheet-id=1kdANBJLmrnc8s5enGOohfW7X80bnqKaM_Dr_uwxEOV4
app.sheets.tab=Form responses 1
app.sheets.submission-sheet-id=1G7twa6sNrJgJRFe2rv-EzMO-XDSYw69KH62MJ5WZuso
app.sheets.submission-tab=Form Responses 1
app.sheets.credentials-path=credentials/sheets-key.json
