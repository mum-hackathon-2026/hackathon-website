# Copy this file to application-local.properties and fill in real values.
# application-local.properties is gitignored — never commit real secrets.
#
# Local Postgres 16 runs in Docker on port 5433 (container hackathon-pg16).
# Port 5432 is a separate, unrelated native PostgreSQL 18 install — do not use it
# for this project.
#
# Two roles, on purpose:
#   hackathon_app      — the application. LOGIN + DML only, no DDL rights.
#   hackathon_migrator — owns the schema. Used by Flyway to run migrations.
# Running Flyway as hackathon_app will fail: it cannot create tables, by design.

spring.datasource.url=jdbc:postgresql://localhost:5433/hackathon_db
spring.datasource.username=hackathon_app
spring.datasource.password=dev_app_local

spring.flyway.url=jdbc:postgresql://localhost:5433/hackathon_db
spring.flyway.user=hackathon_migrator
spring.flyway.password=dev_migrator_local

spring.jpa.show-sql=true

# Google ID token verification. The frontend obtains the token via Google
# Identity Services and sends it to POST /api/auth/google.
app.google.client-id=YOUR_GOOGLE_CLIENT_ID

# The OAuth2 client registration below is NOT used by the auth flow (we verify
# the ID token directly rather than using a server-side redirect). It is kept
# for reference in case the team later needs the redirect flow for another
# integration.
# spring.security.oauth2.client.registration.google.client-id=
# spring.security.oauth2.client.registration.google.client-secret=
# spring.security.oauth2.client.registration.google.scope=email,profile

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.jwt.secret=YOUR_JWT_SIGNING_SECRET
app.jwt.expiration-ms=3600000
app.webhook.secret=YOUR_WEBHOOK_SECRET

# Comma-separated list of allowed origins. Defaults to http://localhost:4200.
# On deployment, set APP_CORS_ALLOWED_ORIGINS to the production frontend URL (e.g. https://monash-hackathon-2026.web.app).
app.cors.allowed-origins=http://localhost:4200
