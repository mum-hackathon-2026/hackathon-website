# Copy this file to application-local.properties and fill in real values.
# application-local.properties is gitignored — never commit real secrets.

spring.datasource.url=jdbc:postgresql://localhost:5432/hackathon_db
spring.datasource.username=postgres
spring.datasource.password=changeme

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.jwt.secret=YOUR_JWT_SIGNING_SECRET
app.jwt.expiration-ms=3600000