# Test configuration.
#
# Tests run against a real PostgreSQL 16 database, not an in-memory substitute.
# H2 was removed deliberately: the baseline schema uses Postgres-specific DDL
# (timestamptz, jsonb, identity columns, partial-expression CHECKs), and a test
# database that cannot execute the real migrations proves nothing.
#
# Locally this points at hackathon_db_test on the Docker container (port 5433).
# CI overrides all three values via environment variables so the workflow can
# reach its own service container on 5432.
#
# This file shadows src/main/resources/application.properties entirely rather than
# merging with it — both sit at the classpath root under the same name, and the test
# classpath wins. Every setting the tests need must therefore be repeated here.

spring.application.name=hackathon-website-backend

spring.datasource.url=${DB_TEST_URL:jdbc:postgresql://localhost:5433/hackathon_db_test}
spring.datasource.username=${DB_TEST_USER:hackathon_migrator}
spring.datasource.password=${DB_TEST_PASSWORD:dev_migrator_local}

# Tests apply migrations as the schema owner, so Flyway shares the test credentials.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${DB_TEST_URL:jdbc:postgresql://localhost:5433/hackathon_db_test}
spring.flyway.user=${DB_TEST_USER:hackathon_migrator}
spring.flyway.password=${DB_TEST_PASSWORD:dev_migrator_local}
# Each run starts from an empty database so V1 is genuinely exercised end to end.
spring.flyway.clean-disabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
