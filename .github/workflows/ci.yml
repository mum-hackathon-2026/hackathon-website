name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # angular-eslint over src/**/*.ts and src/**/*.html, configured in
      # frontend/eslint.config.js. Deliberately no `--if-present`: an earlier
      # version of this step carried it, so when the `lint` script did not exist
      # the step silently did nothing while reading as though the code had been
      # linted. Without it, a missing script fails loudly.
      - name: Lint
        run: npm run lint

      # Vitest under jsdom via the @angular/build:unit-test builder, so no
      # browser is needed. `--watch=false` is explicit rather than left to the
      # builder's CI detection: without it a runner with no TTY would sit in
      # watch mode until the job hit its timeout, which reports as a hang
      # rather than as a test failure. Non-zero exit on a failing spec fails
      # the job — no `continue-on-error`, no `--if-present`.
      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest

    # Tests run against a real Postgres 16 — the same major version as local
    # development. There is no in-memory fallback; the baseline migration uses
    # Postgres-specific DDL that a substitute engine cannot execute.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hackathon_db_test
          POSTGRES_USER: hackathon_migrator
          POSTGRES_PASSWORD: ci_only_migrator_pw
        ports:
          - 5432:5432
        # The job must not start compiling until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U hackathon_migrator -d hackathon_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test
        run: ./mvnw -B clean verify
        # The service container is published on the runner's localhost:5432.
        # Local development uses 5433 instead, because port 5432 there belongs to
        # an unrelated native PostgreSQL 18 install.
        env:
          DB_TEST_URL: jdbc:postgresql://localhost:5432/hackathon_db_test
          DB_TEST_USER: hackathon_migrator
          DB_TEST_PASSWORD: ci_only_migrator_pw
